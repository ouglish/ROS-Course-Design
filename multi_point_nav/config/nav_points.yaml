# 多点导航目标点配置文件
#
# 说明
# ----
# 每个目标点包含三个字段：
#   x     - 地图坐标系下的 x 坐标（单位：米）
#   y     - 地图坐标系下的 y 坐标（单位：米）
#   theta - 目标朝向（偏航角），单位：弧度
#           正值为逆时针，0 为正东方向（地图 x 轴方向）
#           常用值：0=东, 1.5708=北(π/2), 3.1416=西(π), -1.5708=南(-π/2)
#
# 问题1 说明
# ----------
# 当相邻两个目标点的 x/y 不变、只有 theta 变化时，导航节点会自动
# 判断为"仅旋转目标"，并在旋转完成后检测 x/y 漂移，若超过阈值
# 则自动发送修正目标。下方 wp2 -> wp3 即为此类情况的示例。

waypoints:
  # 目标点1：前进到 (1.0, 0.0)，朝向正东（0 rad）
  - x: 1.0
    y: 0.0
    theta: 0.0

  # 目标点2：前进到 (1.0, 1.0)，朝向正北（π/2 rad）
  - x: 1.0
    y: 1.0
    theta: 1.5708

  # 目标点3：原地旋转 180°，朝向正西（π rad）
  # x/y 与上一目标点相同 → 将被识别为"仅旋转目标"
  # 旋转完成后节点会自动检测 x/y 漂移并进行修正（解决问题1）
  - x: 1.0
    y: 1.0
    theta: 3.1416

  # 目标点4：返回起点附近
  - x: 0.0
    y: 0.0
    theta: 0.0
